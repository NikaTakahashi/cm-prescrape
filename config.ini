# ============================================================================
# cm-prescrape configuration (pre-download of Console Mode artwork)
# ----------------------------------------------------------------------------
# Edit ONLY the sd_root line with the path where the root of your MiSTer
# SSD/SD is mounted (the folder that contains "games" or "Games" and "_Arcade").
# ============================================================================

[path]
# Root of the MiSTer SD/SSD (NOT the games folder, the root that contains it).
# Examples:
#   sd_root=/run/media/youruser/MiSTerSSD
#   sd_root=/media/youruser/MISTER
sd_root=

[download]
# Simultaneous download threads (8-24 is reasonable; don't go too high to
# avoid hammering the libretro CDN).
jobs=16

# Main cover art source. Possible values:
#   boxarts  -> Named_Boxarts  (2D box art)              [what Console Mode uses]
#   snaps    -> Named_Snaps    (screenshot)
#   titles   -> Named_Titles   (title screen)
#   logos    -> Named_Logos    (game logo)
main_source=boxarts

# Alternative background (saved as <rom>-BG.png, Console Mode format).
# Values: snaps | titles | logos | none
bg_source=snaps

# List of systems to process, comma-separated (folder names exactly as they
# appear in games/, e.g. SNES,PSX,NES). Empty = all detected systems.
systems=

# Re-download even if the file already exists (0 = skip existing, 1 = force)
force=0

[arcade]
# Scrape MiSTer arcade artwork from _Arcade/*.mra (same libretro CDN source,
# saved as _Arcade/media/<game>.png + <game>-BG.png). 1 = enabled.
enabled=1

# Also scrape the alternative MRAs in _Arcade/_alternatives/ (almost 900 extra
# files, mostly variants; their art goes next to each file). 0 = only the main
# _Arcade/*.mra list.
include_alternatives=0

[network]
# Retries per download and timeout in seconds
retries=3
timeout=30

[optimize]
# Generate downscaled thumbnails in media/optimized/ (same as Console Mode's
# "Optimize Artwork"), so the MiSTer doesn't have to resize them itself.
enabled=1

# Max size of the generated thumbnails in pixels (they keep aspect ratio)
max_width=400
max_height=400
